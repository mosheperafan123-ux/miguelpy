<section id="causas" class="seccion" data-capitulo="1.2" data-titulo-corto="Causas y efectos" aria-labelledby="causas-titulo">
  <div class="contenedor">
    <header class="cabecera-seccion">
      <p class="ref-capitulo">1.2<span>Problema central</span></p>
      <div>
        <h2 class="titulo-seccion" id="causas-titulo" data-extender>Qué lo causa y qué produce</h2>
        <p class="entradilla">
          Cuatro causas alimentan un mismo problema central, y de ese problema se derivan cuatro efectos.
        </p>
      </div>
    </header>

    <!-- Árbol del problema como placa de circuito. Las trazas se calculan en JS con la posición
         real de las cajas; sin JS el árbol se lee igual en tres columnas. -->
    <figure class="causas__figura">
      <div class="causas__escena">
        <div class="causas__placa">
          <svg class="causas__trazas" viewBox="0 0 100 100" aria-hidden="true" focusable="false"></svg>

          <div class="causas__columna causas__columna--causas">
            <h3 class="causas__etiqueta etiqueta" id="causas-titulo-causas">Causas</h3>
            <ul class="causas__lista causas__lista--causas" role="list" aria-labelledby="causas-titulo-causas">
              <li class="causas__nodo">
                <span class="causas__marco" aria-hidden="true"></span>
                <span class="causas__texto">Falta de un canal centralizado para registrar donaciones disponibles</span>
              </li>
              <li class="causas__nodo">
                <span class="causas__marco" aria-hidden="true"></span>
                <span class="causas__texto">Ausencia de información actualizada sobre necesidades por sector</span>
              </li>
              <li class="causas__nodo">
                <span class="causas__marco" aria-hidden="true"></span>
                <span class="causas__texto">Poca comunicación entre organizaciones donantes y comunidades</span>
              </li>
              <li class="causas__nodo">
                <span class="causas__marco" aria-hidden="true"></span>
                <span class="causas__texto">Procesos manuales (listas, WhatsApp) propensos a error</span>
              </li>
            </ul>
          </div>

          <div class="causas__chip">
            <span class="causas__chip-marco" aria-hidden="true"></span>
            <span class="causas__led" aria-hidden="true"><span class="causas__led-luz"></span></span>
            <div class="causas__chip-contenido">
              <p class="causas__chip-etiqueta etiqueta">Problema central</p>
              <p class="causas__chip-titulo">Falta de información centralizada entre oferta y demanda</p>
              <p class="causas__chip-texto">
                Las donaciones en Cali no siempre llegan a los sectores que más las necesitan, debido a la falta de
                información centralizada sobre la oferta y la demanda de ayuda humanitaria.
              </p>
            </div>
          </div>

          <div class="causas__columna causas__columna--efectos">
            <h3 class="causas__etiqueta etiqueta" id="causas-titulo-efectos">Efectos</h3>
            <ul class="causas__lista causas__lista--efectos" role="list" aria-labelledby="causas-titulo-efectos">
              <li class="causas__nodo">
                <span class="causas__marco" aria-hidden="true"></span>
                <span class="causas__texto">Acumulación de donaciones en algunos sectores</span>
              </li>
              <li class="causas__nodo">
                <span class="causas__marco" aria-hidden="true"></span>
                <span class="causas__texto">Desperdicio de alimentos perecederos</span>
              </li>
              <li class="causas__nodo">
                <span class="causas__marco" aria-hidden="true"></span>
                <span class="causas__texto">Desconfianza hacia las organizaciones donantes</span>
              </li>
              <li class="causas__nodo">
                <span class="causas__marco" aria-hidden="true"></span>
                <span class="causas__texto">Retrasos en la atención a población vulnerable</span>
              </li>
            </ul>
          </div>
        </div>
      </div>
      <figcaption class="causas__pie nota-fuente">Árbol del problema. Fuente: elaboración propia del equipo.</figcaption>
    </figure>
  </div>
</section>
